name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-core:
    name: Core library tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze core library
        working-directory: packages/pjatk_core
        run: dart analyze

      - name: Run core tests
        working-directory: packages/pjatk_core
        run: dart test

  test-app:
    name: App widget tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app
        working-directory: packages/app
        run: flutter analyze

      - name: Run app tests
        working-directory: packages/app
        run: flutter test
